[package]
name = "cli"
version = "0.1.0"
edition = "2021"
# Explicit [[bin]] list so HTTP process is `butler-server` in btop/ps (not bare `server`).
autobins = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
code_graph = { path = "../code_graph" }
serde = { version = "1.0.228", features = ["derive"] }
axum = { version = "0.7", features = ["json"] }   # minimal, fast web server
tokio = { version = "1", features = ["full"] }    # runtime for axum
socket2 = "0.5"  # for SO_REUSEADDR before bind (Docker phantom port resilience)
serde_json = "1"
strsim = "0.11"
reqwest = { version = "0.12", features = ["json", "blocking"] }
uuid = { version = "1.22.0", features = ["v4"] }
config = "0.14"
directories = "5.0"
regex = "1"
base64 = "0.22"

[[bin]]
name = "butler"
path = "src/main.rs"

[[bin]]
name = "butler-server"
path = "src/bin/server.rs"

[[bin]]
name = "mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "rust-gpt"
path = "src/bin/rust-gpt.rs"
